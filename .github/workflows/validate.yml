name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate public skill
        run: python scripts/skill_manager.py validate
      - name: Test installation and packaging
        run: python -m unittest discover -s tests -v
      - name: Build skill ZIP
        run: python scripts/skill_manager.py package
